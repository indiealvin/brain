name: release

# A release is driven by package.json's "version":
# - A push to main releases v<version> when that tag does not exist yet. A
#   merge that does not bump the version releases nothing.
# - A pushed tag v* still releases, but only if it equals v<version>, so a
#   binary never reports a version other than its tag.
# The release notes are the CHANGELOG.md section for the version
# (scripts/changelog-section.sh); a version without one is not released.
# The tag and the GitHub release are created by the release job through the
# API (softprops/action-gh-release). A tag pushed with GITHUB_TOKEN would not
# trigger another workflow, which is why tagging and building happen in this
# one workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "$tag" ]; then
              echo "::error::pushed tag ${GITHUB_REF_NAME} does not match package.json version $version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "will release $tag from ${GITHUB_SHA}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: changelog section
        if: steps.decide.outputs.release == 'true'
        run: |
          if ! scripts/changelog-section.sh "${{ steps.decide.outputs.tag }}" > /dev/null; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.decide.outputs.tag }}"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: brain-linux-x64
          - target: bun-linux-arm64
            asset: brain-linux-arm64
          - target: bun-darwin-arm64
            asset: brain-darwin-arm64
          - target: bun-darwin-x64
            asset: brain-darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: compile
        run: |
          mkdir -p dist
          bun build --compile --minify --target=${{ matrix.target }} src/cli.ts --outfile dist/brain
          cd dist
          tar -czf ${{ matrix.asset }}.tar.gz brain
          sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  release:
    needs: [check, build, test]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: smoke-test linux binary
        run: |
          tar -xzf assets/brain-linux-x64.tar.gz -C assets
          export BRAIN_HOME=$(mktemp -d)
          assets/brain --version
          assets/brain init /tmp/smoke-notes
          cd /tmp/smoke-notes && BRAIN_MODEL_MOCK=1 "$GITHUB_WORKSPACE/assets/brain" chat --once hello --wait
      - name: release notes
        run: scripts/changelog-section.sh "${{ needs.check.outputs.tag }}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            assets/*.tar.gz
            assets/*.sha256
            scripts/install.sh
          generate_release_notes: true
