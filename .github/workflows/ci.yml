name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: compile smoke
        run: |
          bun build --compile --minify src/cli.ts --outfile /tmp/brain
          export BRAIN_HOME=$(mktemp -d)
          /tmp/brain init /tmp/smoke-notes
          cd /tmp/smoke-notes && BRAIN_MODEL_MOCK=1 /tmp/brain chat --once hello --wait
